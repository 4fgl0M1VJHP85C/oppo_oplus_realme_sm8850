# 纯净 GKI 6.12.23 内核构建（官方 AOSP 源 + 官方 prebuilt 工具链，优先官方、失败回退 cctv18）
#
# 目的：只编译官方 GKI 源码，去除所有树外驱动/补丁，并尽量使用官方上游组件。
#
# 来源与策略：
#   内核源码   : github.com/aosp-mirror/kernel_common (pin 82efd984... = android16-6.12-2025-06 / 6.12.23)
#   工具链优先级：
#     1) 官方 android.googlesource.com prebuilts（pin SHA）
#        clang      : platform/prebuilts/clang/host/linux-x86   (70a12c4f..., clang-r536225)
#        rust       : platform/prebuilts/rust                    (b9c747ff..., 1.82.0)
#        build-tools: kernel/prebuilts/build-tools              (010d8a83..., 含 pahole/dtc/stg)
#        bindgen    : platform/prebuilts/clang-tools            (2e77dab4...)
#     2) googlesource 下载失败（如 503/限流）时，自动回退 cctv18/oneplus_sm8650_toolchain
#        的同版本官方二进制转包（clang-r536225 / rust 1.82.0(含 bindgen) / build-tools）
#
# 关键点：
#   1) 显式 export KBUILD_GENDWARFKSYMS_STABLE=1：官方源没有 fork 自带的 _setup_env.sh，
#      缺此设置会导致符号 CRC 失配、原厂 vendor_dlkm 模块无法加载。
#   2) 保留 -fdebug/macro/file-prefix-map 路径重映射，避免绝对路径污染符号 CRC。
#   3) 保留 raw `make gki_defconfig && make Image`（避开 Kleaf/Bazel），只编译原始 gki_defconfig。
#   4) 已移除 ccache / faketime / 公共 ccache 依赖（构建不再依赖本仓库内任何文件）。
#
# 说明：googlesource 的 +archive 端点不支持 HTTP Range，故一律用单连接 curl 串行下载并重试，
#      不再使用 aria2c 多连接（那是之前 503 的诱因）。

name: XiaomiGKI6.12.23
env:
  TZ: Asia/Shanghai
  KERNEL_VERSION: '6.12'
  SUB_VERSION: '23_gki'
  KERNEL_NAME: 'android16-5-ga8f88ad96df3-ab13929693-4k'

on:
  workflow_dispatch:
    inputs:
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符,勿加空格等影响指令运行的保留字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: 安装依赖 + 拉取官方 GKI 源码与工具链（官方优先，失败回退 cctv18）
        run: |
          set -e
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace

          sudo apt-mark hold firefox
          sudo apt-mark hold libc-bin
          sudo apt purge -y man-db || true
          sudo rm -rf /var/lib/man-db/auto-update
          sudo apt update
          sudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev libdw-dev aria2

          # 官方 googlesource +archive：单连接 curl，多次重试（该端点不支持 Range，禁用多连接下载）
          fetch_gs() {
            local url="$1" out="$2" i
            for i in 1 2 3; do
              if curl -fL --http1.1 --retry 5 --retry-all-errors --retry-delay 8 --connect-timeout 30 -o "$out" "$url"; then
                return 0
              fi
              echo "googlesource 下载失败(第 $i 次)：$url"
              sleep 10
            done
            return 1
          }
          CCTV="https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225"

          echo "拉取官方内核源码 (aosp-mirror/kernel_common @ 82efd984, android16-6.12-2025-06 / 6.12.23)..."
          aria2c -s16 -x16 -k1M "https://github.com/aosp-mirror/kernel_common/archive/82efd98459a2779ae85cb9ee55f9e7b61a31bf7a.zip" -o common.zip \
            || curl -fL --retry 8 --retry-all-errors --retry-delay 8 -o common.zip "https://github.com/aosp-mirror/kernel_common/archive/82efd98459a2779ae85cb9ee55f9e7b61a31bf7a.zip"
          unzip -q common.zip
          mv "kernel_common-82efd98459a2779ae85cb9ee55f9e7b61a31bf7a" common
          rm -f common.zip

          echo "拉取官方 clang r536225..."
          if fetch_gs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/70a12c4fe88940ab2b0e6d763492dffa2f07e15a/clang-r536225.tar.gz" clang.tar.gz; then
            mkdir -p clang19 && tar -xzf clang.tar.gz -C clang19 && rm -f clang.tar.gz
          else
            echo "googlesource 不可用，回退 cctv18 clang..."
            curl -fL --retry 8 --retry-all-errors --retry-delay 8 -o clang.zip "$CCTV/clang-r536225.zip"
            mkdir -p clang19 && unzip -q clang.zip -d clang19 && rm -f clang.zip
          fi

          echo "拉取官方 Rust 1.82.0..."
          if fetch_gs "https://android.googlesource.com/platform/prebuilts/rust/+archive/b9c747ff3d3c30c2014b6f94f8599415010ac37f/linux-x86/1.82.0.tar.gz" rust.tar.gz; then
            mkdir -p rust && tar -xzf rust.tar.gz -C rust && rm -f rust.tar.gz
          else
            echo "googlesource 不可用，回退 cctv18 rust..."
            curl -fL --retry 8 --retry-all-errors --retry-delay 8 -o rust.zip "$CCTV/rust.zip"
            mkdir -p rust && unzip -q rust.zip -d rust && rm -f rust.zip
          fi

          echo "拉取官方 kernel build-tools (pahole/dtc/stg/lz4 等)..."
          if fetch_gs "https://android.googlesource.com/kernel/prebuilts/build-tools/+archive/010d8a83d84ced4beef7779453766350db8c08cd/linux-x86.tar.gz" build-tools.tar.gz; then
            mkdir -p build-tools && tar -xzf build-tools.tar.gz -C build-tools && rm -f build-tools.tar.gz
          else
            echo "googlesource 不可用，回退 cctv18 build-tools..."
            curl -fL --retry 8 --retry-all-errors --retry-delay 8 -o build-tools.zip "$CCTV/build-tools.zip"
            unzip -q build-tools.zip && rm -f build-tools.zip
          fi

          echo "拉取官方 bindgen (prebuilts/clang-tools)..."
          if fetch_gs "https://android.googlesource.com/platform/prebuilts/clang-tools/+archive/2e77dab4d331387ed8036a3b2ae9fa48ca2f74a4/linux-x86.tar.gz" clang-tools.tar.gz; then
            mkdir -p clang-tools && tar -xzf clang-tools.tar.gz -C clang-tools && rm -f clang-tools.tar.gz
          else
            echo "googlesource 不可用，从 cctv18 rust.zip 提取 bindgen..."
            if [ ! -x rust/bin/bindgen ]; then
              curl -fL --retry 8 --retry-all-errors --retry-delay 8 -o rust-fb.zip "$CCTV/rust.zip"
              mkdir -p rust-fb && unzip -q rust-fb.zip -d rust-fb
              mkdir -p rust/bin && cp -f rust-fb/bin/bindgen rust/bin/ && chmod +x rust/bin/bindgen
              rm -rf rust-fb rust-fb.zip
            fi
          fi

          echo "所有源码及工具链初始化完成！"

          echo "正在去除 dirty 后缀..."
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 添加制作名称
        run: |
          cd kernel_workspace
          echo "替换内核版本后缀..."
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            echo "当前内核版本后缀：${{ github.event.inputs.kernel_suffix }}"
            for f in ./common/scripts/setlocalversion; do
              sed -i "\$s|echo \"\\\$res\"|echo \"-${{ github.event.inputs.kernel_suffix }}\"|" "$f"
            done
            sudo sed -i 's/-4k/-${{ github.event.inputs.kernel_suffix }}/g' ./common/arch/arm64/configs/gki_defconfig
          else
            echo "当前内核版本后缀：${{ env.KERNEL_NAME }}"
            for f in ./common/scripts/setlocalversion; do
              sed -i "\$s|echo \"\\\$res\"|echo \"-${{ env.KERNEL_NAME }}\"|" "$f"
            done
            sudo sed -i 's/-4k/-${{ env.KERNEL_NAME }}/g' ./common/arch/arm64/configs/gki_defconfig
          fi
          sed -i 's/${scm_version}//' ./common/scripts/setlocalversion
          echo "CONFIG_LOCALVERSION_AUTO=n" >> ./common/arch/arm64/configs/gki_defconfig

      - name: 构建内核
        run: |
          WORKDIR="$(pwd)"
          export PATH="$WORKDIR/kernel_workspace/clang19/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/rust/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang-tools/bin:$PATH"
          CLANG_DIR="$WORKDIR/kernel_workspace/clang19/bin"
          CLANG_VERSION="$($CLANG_DIR/clang --version | head -n 1)"
          LLD_VERSION="$($CLANG_DIR/ld.lld --version | head -n 1)"
          RUSTC_VERSION="$(rustc -V 2>/dev/null | head -n1)"
          BINDGEN_VERSION="$(bindgen --version 2>/dev/null | head -n1)"
          echo "编译器信息:"
          echo "Clang版本: $CLANG_VERSION"
          echo "LLD版本: $LLD_VERSION"
          echo "Rustc版本: $RUSTC_VERSION"
          echo "Bindgen版本: $BINDGEN_VERSION"
          pahole_version=$(pahole --version 2>/dev/null | head -n1); [ -z "$pahole_version" ] && echo "pahole版本：未安装" || echo "pahole版本：$pahole_version"

          cd kernel_workspace/common

          # 6.12内核make编译核心配置：
          # 1. 重映射物理路径 (由于6.12内核引入了Rust代码，计算内核符号版本的工具变成了gendwarfksyms，而gendwarfksyms无法正确预处理绝对路径，故我们需要手动把绝对路径重映射为相对路径，否则内核符号校验值会大面积出错)
          COMMON_REAL_PATH=$(pwd -P)
          ROOT_REAL_PATH=$(dirname "$COMMON_REAL_PATH")
          KCFLAGS+=" -fdebug-prefix-map=$ROOT_REAL_PATH=."
          KCFLAGS+=" -fmacro-prefix-map=$ROOT_REAL_PATH=."
          KCFLAGS+=" -ffile-prefix-map=$ROOT_REAL_PATH=."
          # 2. 声明Rust等工具（此处若不进行声明，内核编译前的Rust环境预检测脚本scripts/rust_is_available.sh会检测失败，导致内核无法正常开启Rust代码编译）
          export RUSTC="rustc"
          export BINDGEN="bindgen"
          export CC="clang"
          export LIBCLANG_PATH="$WORKDIR/kernel_workspace/clang19/lib"
          # 3. 配置KCFLAGS
          KCFLAGS+=" -no-canonical-prefixes"
          KCFLAGS+=" -O2"
          KCFLAGS+=" -pipe"
          KCFLAGS+=" -Wno-error"
          KCFLAGS+=" -fno-stack-protector"
          KCFLAGS+=" -D__ANDROID_COMMON_KERNEL__"
          export KCFLAGS
          # 4. 配置其他工具及选项（非必须，防错冗余）
          export HOSTCC=clang
          export LD="ld.lld"
          export HOSTLD=ld.lld
          export LLVM=1 LLVM_IAS=1
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LD=ld.lld HOSTLD=ld.lld AR=llvm-ar NM=llvm-nm AS=clang READELF=llvm-readelf
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump OBJSIZE=llvm-size STRIP=llvm-strip
          # 5. 关键：开启 gendwarfksyms stable 模式，生成与编译器/路径无关的稳定符号 CRC，
          #    否则官方源构建出的镜像无法加载原厂 vendor_dlkm 模块（官方源没有 fork 自带 _setup_env.sh，
          #    该脚本原本负责 export KBUILD_GENDWARFKSYMS_STABLE=1，故在此显式补上）
          export KBUILD_GENDWARFKSYMS_STABLE=1

          #在构建内核的同时清除不必要的.NET, Android NDK, Haskell, CodeQL运行库，清理空间且不阻塞后续步骤运行
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="clang" LD="ld.lld" OBJCOPY="llvm-objcopy" O=out gki_defconfig &&
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="clang" LD="ld.lld" OBJCOPY="llvm-objcopy" O=out Image

          echo "内核编译完成！"
          echo "编译后空间:"
          df -h

      - name: 克隆 AnyKernel3 并打包
        id: create_zip
        run: |
          cd kernel_workspace
          aria2c -s8 -x8 -k1M "https://github.com/cctv18/AnyKernel3/archive/091ee586e1a5d5c1c1c957d48fe7c61638d04dc4.zip" -o ak3.zip \
            || curl -fL --retry 8 --retry-all-errors --retry-delay 8 -o ak3.zip "https://github.com/cctv18/AnyKernel3/archive/091ee586e1a5d5c1c1c957d48fe7c61638d04dc4.zip"
          unzip -q ak3.zip
          mv "AnyKernel3-091ee586e1a5d5c1c1c957d48fe7c61638d04dc4" AnyKernel3
          rm -f ak3.zip
          cd AnyKernel3
          cp ../common/out/arch/arm64/boot/Image ./Image
          if [[ ! -f ./Image ]]; then
            echo "未找到内核镜像文件，构建可能出错"
            exit 1
          fi
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            AK3_NAME=AnyKernel3_GKI_${{ env.KERNEL_VERSION }}_${{ github.event.inputs.kernel_suffix }}.zip
          else
            AK3_NAME=AnyKernel3_GKI_${{ env.KERNEL_VERSION }}_${{ env.KERNEL_NAME }}.zip
          fi
          zip -r ../$AK3_NAME ./*
          echo "ak3name=$AK3_NAME" >> $GITHUB_OUTPUT

          #为AK3添加注释（调试信息）
          CLEAN_SUB_VERSION="${{ env.SUB_VERSION }}"
          CLEAN_SUB_VERSION="${CLEAN_SUB_VERSION%_mtk}"
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ github.event.inputs.kernel_suffix }}
          else
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ env.KERNEL_NAME }}
          fi
          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "Author: $GITHUB_ACTOR" > ./ak3.log
          echo "Repo: $GITHUB_REPOSITORY" >> ./ak3.log
          echo "Branch: $GITHUB_REF_NAME" >> ./ak3.log
          echo "Run ID: $GITHUB_RUN_ID" >> ./ak3.log
          echo "Commit: $GITHUB_SHA" >> ./ak3.log
          echo "Time: $TIME_NOW" >> ./ak3.log
          echo "Kernel Ver: $FULL_VERSION" >> ./ak3.log
          echo "Source: aosp-mirror/kernel_common @ 82efd984 (android16-6.12-2025-06 / 6.12.23)" >> ./ak3.log
          echo "Toolchain: googlesource prebuilts (fallback cctv18) - clang-r536225 / rust 1.82.0 / build-tools" >> ./ak3.log
          echo "Type: Pure GKI (no out-of-tree drivers)" >> ./ak3.log
          zip -z ../$AK3_NAME < ./ak3.log

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/kernel_workspace/AnyKernel*.zip
          archive: false

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: ./release_zips
          skip-decompress: true

      - name: 设置环境变量
        run: |
          CLEAN_SUB_VERSION="${{ env.SUB_VERSION }}"
          CLEAN_SUB_VERSION="${CLEAN_SUB_VERSION%_mtk}"
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ github.event.inputs.kernel_suffix }}
            echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
            export FULL_VERSION=$FULL_VERSION
          else
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ env.KERNEL_NAME }}
            echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
            export FULL_VERSION=$FULL_VERSION
          fi
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV
          TAG_HEAD="GKI-Pure-build"
          echo "TAG_HEAD=$TAG_HEAD" >> $GITHUB_ENV

      - name: 创建发布
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 🧩 纯净 GKI ${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }} 内核 | 构建信息
          - 内核版本号: ${{ env.FULL_VERSION }}
          - 编译时间: ${{ env.TIME_FORM }}
          - 源码：官方 AOSP GKI 镜像 `aosp-mirror/kernel_common` @ `82efd984`（android16-6.12-2025-06 / 6.12.23）
          - 工具链：优先官方 AOSP prebuilts（clang-r536225 / rust 1.82.0 / kernel build-tools / bindgen），googlesource 不可用时回退 cctv18 同版本二进制
          - 特性：仅编译原始 `gki_defconfig`，无 KernelSU/SUSFS/lz4kd/BBR-Brutal/Droidspaces/ADIOS/Re-Kernel/BBG/KPM 等树外组件
          - 符号 CRC：开启 `KBUILD_GENDWARFKSYMS_STABLE=1` + 路径重映射，匹配原厂 vendor_dlkm

          ### 📋 安装方法 | Installation Guide
          1. 若你的手机已经安装第三方 Recovery（如 TWRP），可进入 Recovery 刷入 AnyKernel 包后重启；
          2. 若已有 root 权限，可用 [HorizonKernelFlasher](https://github.com/libxzr/HorizonKernelFlasher/releases) 刷入并重启；
          3. 刷入后可用 `dmesg | grep -iE "disagrees about version|Unknown symbol|no symbol version"` 确认厂商模块符号匹配。

          #### ※※※刷写内核有风险，为防止出现意外导致手机变砖，在刷入内核前请务必用 [KernelFlasher](https://github.com/capntrips/KernelFlasher) 等软件备份 boot 等关键启动分区！※※※
          EOF

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.TAG_HEAD }}-${{ env.FULL_VERSION }}" \
            --notes-file release_notes.md \
            release_zips/AnyKernel3_*.zip
